name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# новый push в ту же ветку отменяет прежний незаконченный прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # демки лежат в Git LFS и тестам не нужны: тесты на реальной демке пропускаются без CS2_TEST_DEMO
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependency guard
        run: cargo test --release -p server --test deps
      - name: Tests
        run: cargo test --release --workspace
      - name: Build cs2-cli
        run: cargo build --release -p cli
      - name: Build cs2-server
        run: cargo build --release -p server
      - name: Upload Linux server build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cs2-server-linux-x64
          path: target/release/cs2-server
          if-no-files-found: error
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cs2-cli-windows-x64
          path: target/release/cs2-cli.exe
          if-no-files-found: error

  # сквозная цепочка: фейковый Telegram -> бот -> сервер -> раннер на FakeHost -> ролик в чате (OPS-03)
  chain:
    name: chain (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependency guard
        run: cargo test --release -p server --test deps
      - name: Chain test
        run: cargo test --release -p runner --test chain -- --nocapture
