name: Release (Windows)

# Тег вида v0.1.0 -> сборка и GitHub Release с zip для Windows.
# Вручную (Actions -> Release (Windows) -> Run workflow):
#   * поле tag заполнено (например v0.1.0) -> тег создаётся на выбранной ветке и публикуется релиз;
#   * поле пустое -> только артефакт сборки, без релиза.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.0 (пусто — только собрать артефакт)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # создание релиза
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release -p cli

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/cs2cinema"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/cs2-cli.exe $dir
          Copy-Item README.md $dir
          Copy-Item -Recurse scripts "$dir/scripts"
          Compress-Archive -Path $dir -DestinationPath cs2cinema-windows-x64.zip -Force
          (Get-FileHash cs2cinema-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  cs2cinema-windows-x64.zip" | Set-Content cs2cinema-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cs2cinema-windows-x64
          path: |
            cs2cinema-windows-x64.zip
            cs2cinema-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag || github.ref_name }}
          files: |
            cs2cinema-windows-x64.zip
            cs2cinema-windows-x64.zip.sha256
          generate_release_notes: true
