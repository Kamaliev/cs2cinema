[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cs2-cli"
path = "src/main.rs"

[dependencies]
demo = { path = "../demo" }
cs2 = { path = "../cs2" }
highlights = { path = "../highlights" }
director = { path = "../director" }
renderer = { path = "../renderer" }
faceit = { path = "../faceit" }
positions = { path = "../positions" }
geometry = { path = "../geometry" }
pipeline = { path = "../pipeline" }
store = { path = "../store" }
runner = { path = "../runner" }
ctrlc = { version = "3.5", features = ["termination"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
prost = "0.14.4"
