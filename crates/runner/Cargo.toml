[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
wire = { path = "../wire" }
pipeline = { path = "../pipeline" }
faceit = { path = "../faceit" }
ureq = { version = "3", features = ["json", "platform-verifier"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
server = { path = "../server" }
