[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cs2-server"
path = "src/main.rs"

[dependencies]
wire = { path = "../wire" }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ctrlc = { version = "3.5", features = ["termination"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "3", features = ["json"] }
